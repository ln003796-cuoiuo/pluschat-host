name: PHP gateway checks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none
          coverage: none
      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' -print0)

  gateway-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pluschat
          MYSQL_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql, mbstring, fileinfo, curl
          tools: none
          coverage: none
      - name: Configure test database
        run: |
          cat > config.php <<'PHP'
          <?php
          return [
            'db_host' => '127.0.0.1',
            'db_name' => 'pluschat',
            'db_user' => 'root',
            'db_password' => 'root',
            'base_url' => 'http://127.0.0.1:8080',
            'mail_from' => 'test@example.test',
            'mail_from_name' => 'Pluschat Test',
            'sms_api_url' => '',
            'sms_api_token' => '',
            'access_ttl' => 900,
            'refresh_ttl' => 2592000,
            'install_token' => 'ci-only-token',
          ];
          PHP
          mkdir -p storage/avatars
          chmod 755 storage storage/avatars
      - name: Start gateway
        run: |
          php -S 127.0.0.1:8080 tests/router.php >/tmp/pluschat-gateway.log 2>&1 &
          echo $! >/tmp/pluschat-gateway.pid
          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null; then ready=1; break; fi
            sleep 1
          done
          test "$ready" -eq 1 || { cat /tmp/pluschat-gateway.log; exit 1; }
      - name: Run gateway integration tests
        run: php tests/gateway-smoke.php
