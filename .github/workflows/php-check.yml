name: Pluschat PHP checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: pdo_mysql
          coverage: none
      - name: Check PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            php -l "$file"
          done < <(find . -type f -name '*.php' -not -path './vendor/*' | sort)
      - name: Check schema and API contract
        shell: bash
        run: |
          set -euo pipefail
          for table in users email_verification_tokens auth_tokens conversations conversation_members messages user_settings user_devices user_blocks chat_groups group_members channels channel_members topics topic_messages message_attachments message_receipts message_reactions reports admin_users notifications; do
            grep -Fq "CREATE TABLE IF NOT EXISTS \${table} (" database/schema.sql
          done
          for route in "/api/v1/health" "/api/v1/auth/register" "/api/v1/auth/login" "/api/v1/conversations" "/api/v1/groups" "/api/v1/channels" "/api/v1/settings" "/api/v1/devices"; do
            grep -Fq "\${route}" public/index.php
          done
