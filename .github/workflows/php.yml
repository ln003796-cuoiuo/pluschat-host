name: PHP server checks

on:
  push:
    branches: [pluschat-completion]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show PHP runtime
        run: php -v && php -m
      - name: Syntax-check PHP files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do php -l "$file"; done < <(find . -type f -name '*.php' -not -path './.git/*' -print0)
      - name: Check server modules
        run: php tests/check-server.php
      - name: Check feature modules
        run: php tests/check-features.php
